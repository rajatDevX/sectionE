<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        body{
            height:100vh;
            width:100vw;
        }
      .box {
        display: flex;
        justify-content: center;
        align-items: center;
        width:100%;
        height:100%;
      }
      .card {
        background-color: aliceblue;
        border: 1px solid #aaa;
        width: 150px;
        margin: auto;
        padding: 10px;
        height: 250px;
        transition: all 0.5s;
      }
      .card:hover {
        box-shadow: 0 10px 20px #ddd;
        transform: scale(2) rotate(45deg);
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="card">
        <h2>Product card</h2>
        <p>this is description of the card</p>
      </div>
    </div>
  </body>
</html>
