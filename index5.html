<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display property</title>
    <style>
        .box1{
            display:block;
            height:200px;
            width:200px;
            background-color:red;
        }
        .box2{
            display:inline;
            height:200px;
            width:200px;
            background-color:blue;
        }
        .box3{
            display:inline-block;
            height:200px;
            width:200px;
            background-color:violet;
        }
    </style>
</head>
<body>
    <div class="box1">
        this is box type 1
        this is box type 2 
    </div>
    <div class="box2">
        this is box type 1
        this is box type 2
    </div>
    <div class="box3">
        this is box type 3
        this is box type 3
    </div>
</body>
</html>
