<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display:flex;
            justify-content: center;
            align-items:center;
            height:100vh;
            
        }
        .box{
            height:100px;
            width:100px;
            background-color:rgb(212, 196, 196);
            border-top:2px solid black;
            border-radius:50%;
            animation:rotate 1s;
            animation-iteration-count: infinite;
        }
        @keyframes rotate{
            from{
                transform:rotate(0deg);
            }
            to{
                transform:rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>
