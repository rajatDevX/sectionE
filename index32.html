<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind css</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div
      class="text-black md:text-red-600 xl:text-blue-500 md:bg-green-100 xl:bg-yellow-100"
    >
      I am making a responsive page
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 mt-2">
      <div class="bg-gray-200 p-4">one</div>
      <div class="bg-gray-200 p-4">two</div>
      <div class="bg-gray-200 p-4">three</div>
      <div class="bg-gray-200 p-4">four</div>
      <div class="bg-gray-200 p-4">five</div>
      <div class="bg-gray-200 p-4">six</div>
    </div>
    <button class="bg-blue-600 px-3 py-2 hover:bg-blue-900 text-white mt-2 mx-auto block rounded">
      Hover me
    </button>
  </body>
</html>
