<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html{
            font-size:10px;
            line-height: 10px;
        }
        h1{
            font-family:'Courier New', Courier, monospace;
            font-size:2rem;
            font-weight:900;
            color:blue;
            font-style:italic;
            text-align:center;
            text-decoration:underline;
            text-transform:capitalize;
            text-shadow:2px 2px 4px red;
            line-height:2;
            letter-spacing: 3px;
            word-spacing: 10px;
        }
        p{
            font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            font-size:3rem;
            font-weight:100;
            font-style:oblique;
            text-align:right;
            /* text-decoration:overline; */
            text-transform: lowercase;
        }
        div{
            font-size:20px;
            line-height:100px;
        }
        div.first  p{
            font-size:2em;
           text-align:center;
           /* text-decoration:line-through; */
           text-transform:uppercase;
        }
    </style>
</head>
<body>
    <h1>I am learning about font properties

    </h1>
    <p>I am going to change font-family of this text</p>
    <div class="first">
        <p>this is a pragraph under parent with class first</p>
        <p>this is second paragraph inside div element</p>
    </div>
</body>
</html>
