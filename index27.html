<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D effects</title>
    <style>
        .scene{
            perspective: 800px;
        }
        .box{
            height:150px;
            width:150px;
            border:1px solid black;
            transform:rotateY(45deg);
            background-color: rgb(212, 196, 196);
            margin:50px auto;
        }
        
    </style>
</head>
<body>
    <div class="scene">
        <div class="box"></div>
    </div>
    
</body>
</html>
