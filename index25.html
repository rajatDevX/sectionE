<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jumping balls</title>
    <style>
        .container{
            display:flex;
            justify-content: center;
            align-items: center;
            height:100vh;
            gap:5px;
        }
        .ball{
            height:50px;
            width:50px;
            background-color: tomato;
            border-radius: 50%;
            animation: jump 1.2s infinite;
        }
        .ball:nth-child(2){
            animation-delay:0.3s;
        }
        .ball:nth-child(3){
            animation-delay:0.6s;
        }
        @keyframes jump{
            0%,100%{
                transform:translateY(0px);
            }
            50%{
                transform:translateY(50px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="ball"></div>
        <div class="ball"></div>
        <div class="ball"></div>
    </div>
</body>
</html>
