<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        background: #f5f5f5;
        font-family: Arial, sans-serif;
      }

      .card {
        width: 280px;
        padding: 15px;

        background: white;
        border: 1px solid #ddd;
        border-radius: 15px;

        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);

        transition:
          transform 0.4s ease,
          box-shadow 0.4s ease;
      }

      .card:hover {
        transform: translateY(-10px);

        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
      }

      .image-box {
        height: 200px;
        overflow: hidden;
        border-radius: 10px;
      }

      .image-box img {
        width: 100%;
        height: 100%;
        object-fit: contain;

        transition: transform 0.5s ease;
      }

      .card:hover img {
        transform: scale(1.1);
      }

      .card h2 {
        margin-bottom: 5px;
      }

      .price {
        font-size: 22px;
        font-weight: bold;
      }

      .rating {
        letter-spacing: 3px;
      }

      button {
        width: 100%;
        padding: 12px;

        border: none;
        border-radius: 8px;

        background: black;
        color: white;

        cursor: pointer;

        transition:
          background-color 0.3s ease,
          transform 0.3s ease;
      }

      button:hover {
        background: orange;
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="image-box">
        <img src="headphone.png" alt="Wireless Headphones" />
      </div>

      <h2>Wireless Headphones</h2>

      <p class="price">₹999</p>

      <p class="rating">★★★★★</p>

      <button>Buy Now</button>
    </div>
  </body>
</html>
