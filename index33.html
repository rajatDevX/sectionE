<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-gray-100 flex justify-center items-center">
    <main class="w-full max-w-sm bg-white rounded-xl p-8 text-center">
      <img
        class="w-24 h-24 object-cover object-center mx-auto rounded-full border-4 border-blue-100"
        src="pic1.png"
        alt="Profile-pic"
      />
      <h2 class="font-bold text-gray-900 mt-4 text-2xl">Rajat Jain</h2>
      <p class="font-medium mt-1 text-blue-600">Frontend Development Student</p>
      <p class="leading-relaxed text-gray-600 text-sm mt-4">
        I am learning to build beautiful and responsive websites using HTML, CSS
        and Tailwind CSS.
      </p>
      <div class="flex justify-center gap-4 mt-5 flex-wrap">
        <span class="bg-blue-100 text-blue-700 rounded-xl px-3 py-2">HTML</span>
        <span class="bg-orange-100 text-orange-700 rounded-xl px-3 py-2">CSS</span>
        <span class="bg-cyan-100 text-cyan-700 rounded-xl px-3 py-2">Tailwind</span>
      </div>

      <details class="mt-6">
        <summary class="bg-blue-600 text-white list-none rounded-lg px-4 py-3 hover:bg-blue-700 transition-colors duration-300 font-medium">view Profile</summary>
        <p class="mt-4 text-gray-600 text-sm">My goal is to create five responsive projects this semester.</p>
      </details>
    </main>
  </body>
</html>
