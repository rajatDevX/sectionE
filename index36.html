<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodePath Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-white text-gray-900">
    <header class="sticky top-0 z-50 shadow-sm">
      <nav
        class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center"
      >
        <a href="#" class="text-2xl text-indigo-700 font-bold">CodePath</a>
        <div class="flex flex-wrap gap-4">
          <a href="#home" class="hover:text-indigo-600">Home </a>
          <a href="#courses" class="hover:text-indigo-600">Courses</a>
          <a href="#about" class="hover:text-indigo-600">About</a>
          <a href="#contact" class="hover:text-indigo-600">Contact</a>
        </div>
      </nav>
    </header>
    <main>
      <div
        class="max-w-6xl mx-auto px-4 py-16 md:py-24 flex flex-col md:flex-row items-center gap-10"
      >
        <div class="w-full md:w-1/2">
          <p class="text-indigo-700 font-semibold mb-3">LEARN. BUILD. GROW.</p>

          <h1 class="text-4xl md:text-5xl font-bold leading-tight">
            Start your coding journey with us.
          </h1>

          <p class="text-gray-600 text-lg leading-relaxed mt-5">
            Learn web development through practical lessons, guided projects and
            regular coding practice.
          </p>

          <a
            href="#courses"
            class="inline-block mt-7 bg-indigo-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-indigo-700 transition-colors"
          >
            Explore Courses
          </a>
        </div>

        <div class="w-full md:w-1/2">
          <img
            src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=900&auto=format&fit=crop&q=80"
            alt="People working together at a laptop"
            class="w-full h-72 md:h-96 object-cover rounded-2xl shadow-xl"
          />
        </div>
      </div>
      <section id="courses"></section>
      <section id="about"></section>
    </main>
  </body>
</html>
