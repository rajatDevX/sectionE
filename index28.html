<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .scene{
            perspective: 600px;
        }
        .card{
            height:200px;
            width:200px;
            background-color: aliceblue;
            border:1px solid black;
            margin:50px auto;
           transition: all 4s;
           display:flex;
           justify-content: center;
           align-items: center;
           backface-visibility: hidden;
        }
        .card:hover{
            transform: rotateY(-45deg) rotateX(180deg);
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="card">
            3D card
        </div>
    </div>
</body>
</html>
